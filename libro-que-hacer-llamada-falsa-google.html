<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#05156d;
    --orange:#ff8201;
    --blue-light:#a4cbdc;
    --peach:#ffe7d2;
    --white:#ffffff;
    --ink:#0c1440;
    --ok:#237046;
    --warn:#96620a;
    --fail:#c53a3a;
    --radius:18px;
    --shadow: 0 10px 30px rgba(5,21,109,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Poppins',sans-serif;color:var(--ink);
    background:linear-gradient(180deg,#fbfcff 0%, #f3f6fc 100%);
    line-height:1.55;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  img{max-width:100%;display:block;}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 40px;}

  header.top{background:var(--navy);padding:16px 18px;}
  .top-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;}
  .top-logo{height:22px;}
  .top-tag{margin-left:auto;font-size:11px;color:var(--blue-light);font-weight:500;text-transform:uppercase;letter-spacing:1px;}

  .book-frame{margin-top:20px;background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-height:520px;display:flex;flex-direction:column;}
  .book-content{padding:30px 26px 20px;flex:1;}
  .page-inner{animation:pageIn .35s ease;}
  @keyframes pageIn{from{opacity:0;transform:translateX(10px);}to{opacity:1;transform:translateX(0);}}

  .eyebrow{display:inline-block;background:var(--peach);color:var(--navy);font-size:11.5px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:5px 13px;border-radius:999px;margin-bottom:14px;}
  h1{font-size:clamp(23px,5vw,29px);font-weight:800;color:var(--navy);margin:0 0 14px;line-height:1.25;}
  h2{font-size:20px;font-weight:800;color:var(--navy);margin:0 0 12px;line-height:1.3;}
  p.body-text{font-size:14.5px;color:#33396b;margin:0 0 12px;}
  .muted{color:#5a5f86;font-size:13.5px;}

  .cover-page{text-align:center;padding-top:10px;}
  .cover-mark{width:70px;margin:0 auto 18px;}
  .cover-sub{font-size:14px;color:#5a5f86;margin:0 0 4px;}
  .cover-author{font-size:12.5px;color:#8a8fb0;margin-top:18px;}

  .check-self{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  .step-row{display:flex;gap:10px;align-items:flex-start;background:#f7f8fd;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#33396b;}
  .step-num{width:22px;height:22px;border-radius:50%;background:var(--navy);color:var(--white);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}

  .callout{margin-top:14px;background:var(--peach);border-radius:12px;padding:13px 15px;font-size:13.5px;color:#4a3418;}
  .callout b{color:var(--navy);}
  .callout.gold{background:var(--navy);color:var(--white);}
  .callout.gold b{color:var(--orange);}

  /* CASE SELECTOR */
  .case-grid{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .case-card{
    display:flex;align-items:center;gap:12px;background:#f7f8fd;border:2px solid transparent;
    border-radius:12px;padding:13px 14px;cursor:pointer;text-align:left;transition:border-color .15s ease;
  }
  .case-card:hover{border-color:var(--blue-light);}
  .case-num{width:32px;height:32px;border-radius:50%;background:var(--navy);color:var(--white);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;}
  .case-card-title{font-size:13.5px;font-weight:700;color:var(--navy);margin-bottom:3px;}
  .risk-pill{display:inline-block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;padding:2px 9px;border-radius:999px;color:var(--white);}
  .risk-none{background:#5a9bd4;}
  .risk-low{background:#96620a;}
  .risk-high{background:#c53a3a;}
  .risk-serious{background:#7a24c9;}

  /* CASE DETAIL */
  .case-back{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--navy);cursor:pointer;margin-bottom:12px;background:none;border:none;padding:0;font-family:'Poppins',sans-serif;}
  .case-back svg{width:13px;height:13px;}
  .checklist-real{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
  .check-row{display:flex;gap:10px;align-items:flex-start;background:#f7f8fd;border-radius:10px;padding:11px 13px;cursor:pointer;transition:background .15s ease;}
  .check-row:hover{background:#eef1fa;}
  .check-box{width:19px;height:19px;border-radius:5px;border:2px solid var(--navy);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .15s ease;}
  .check-row.checked .check-box{background:var(--ok);border-color:var(--ok);color:var(--white);}
  .check-row.checked .check-label{text-decoration:line-through;color:#8a8fb0;}
  .check-label{font-size:13.5px;color:#33396b;}

  /* RECOGNIZE SECTION */
  .rec-cols{display:flex;flex-direction:column;gap:16px;margin-top:14px;}
  .rec-col b{display:block;font-size:13px;color:var(--navy);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.4px;}
  .rec-list{display:flex;flex-direction:column;gap:7px;}
  .rec-item{display:flex;gap:8px;font-size:13.5px;color:#33396b;}
  .quote-box{margin-top:14px;background:#f7f8fd;border-left:4px solid var(--orange);border-radius:8px;padding:12px 14px;}
  .quote-line{font-size:13px;font-style:italic;color:#4a4f76;margin:5px 0;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--orange);color:var(--white);border:none;font-family:'Poppins',sans-serif;
    font-weight:700;font-size:14px;padding:12px 20px;border-radius:12px;cursor:pointer;
    box-shadow:0 8px 18px rgba(255,130,1,0.28);text-decoration:none;
  }
  .btn.secondary{background:transparent;color:var(--navy);border:2px solid var(--navy);box-shadow:none;}
  .btn.wa{background:#25D366;}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn-row{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;}

  .final-logo{width:90px;margin:0 auto 14px;}

  /* NAV BAR */
  .book-nav{
    border-top:1px solid #eef0fb;padding:14px 20px;display:flex;align-items:center;gap:12px;
    background:#fbfcff;
  }
  .nav-btn{
    background:var(--white);border:2px solid #e6ecf7;border-radius:10px;width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--navy);
  }
  .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
  .nav-btn svg{width:16px;height:16px;}
  .progress-wrap{flex:1;}
  .progress-track{width:100%;height:5px;background:#eef0fb;border-radius:999px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--orange);border-radius:999px;transition:width .3s ease;}
  .progress-label{font-size:10.5px;color:#8a8fb0;margin-top:5px;text-align:center;}

  footer.foot{text-align:center;padding:20px 20px 40px;font-size:12px;color:#8a8fb0;}
  footer.foot a{color:var(--navy);font-weight:600;text-decoration:none;}
</style>
</head>

      '<div class="rec-cols">' +
        '<div class="rec-col"><b>Google nunca</b><div class="rec-list">' +

      '</div>' +
      '<div class="quote-box">' +
        '<div class="muted" style="margin-bottom:6px;"><b>Las frases que delatan la estafa:</b></div>' +
        '<div class="quote-line">"Tu negocio no aparece en las 5 plataformas principales de búsqueda"</div>' +

      '</div>' +

  pages.push(function(){

      '<h2>La regla de oro</h2>' +

      '<p class="body-text" style="margin-top:14px;">Si hay un problema de verdad, ahí va a estar. Si no hay nada, no había nada.</p>';

  pages.push(function(){

      '<h2>¿Tienes dudas sobre tu ficha?</h2>' +

  var totalPages = pages.length;
  var current = 0;

  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var progressFill = document.getElementById('progressFill');
  var progressLabel = document.getElementById('progressLabel');

  function renderPage(idx){
    current = Math.max(0, Math.min(totalPages - 1, idx));
    var inner = document.createElement('div');
    inner.className = 'page-inner';
    inner.innerHTML = pages[current]();
    contentEl.innerHTML = '';
    contentEl.appendChild(inner);
    contentEl.scrollTop = 0;
    window.scrollTo({top: document.querySelector('.book-frame').offsetTop - 10, behavior: 'smooth'});

    prevBtn.disabled = (current === 0);
    nextBtn.disabled = (current === totalPages - 1);
    var pct = (current / (totalPages - 1)) * 100;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = 'Página ' + (current + 1) + ' de ' + totalPages;

    var dlBtn = document.getElementById('downloadPdfBtn');
    if(dlBtn){ dlBtn.addEventListener('click', generatePDF); }
  }

  contentEl.addEventListener('click', function(e){
    var jumpEl = e.target.closest('[data-jump]');
    if(jumpEl){
      renderPage(parseInt(jumpEl.getAttribute('data-jump'), 10));
      return;
    }
    var checkEl = e.target.closest('.check-row');
    if(checkEl){
      checkEl.classList.toggle('checked');
    }
  });

  prevBtn.addEventListener('click', function(){ renderPage(current - 1); });
  nextBtn.addEventListener('click', function(){ renderPage(current + 1); });

  renderPage(0);

  // ---------- PDF GENERATION ----------
  function generatePDF(){
    if(!window.jspdf){ alert('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.'); return; }
    var jsPDFCtor = window.jspdf.jsPDF;
    var doc = new jsPDFCtor({unit: 'mm', format: 'a4'});
    var pageW = 210, pageH = 297, margin = 20;
    var maxWidth = pageW - margin * 2;
    var navy = [5, 21, 109];
    var orange = [255, 130, 1];
    var y = margin;

    function ensureSpace(needed){
      if(y + needed > pageH - margin){
        doc.addPage();
        y = margin;
      }
    }
    function heading(text){
      ensureSpace(14);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(15);
      doc.setTextColor(navy[0], navy[1], navy[2]);
      doc.text(text, margin, y);
      y += 9;
    }
    function subheading(text){
      ensureSpace(8);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(11.5);
      doc.setTextColor(navy[0], navy[1], navy[2]);
      var lines = doc.splitTextToSize(text, maxWidth);
      doc.text(lines, margin, y);
      y += lines.length * 5.5 + 3;
    }
    function paragraph(text){
      if(!text) return;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(40, 40, 60);
      var lines = doc.splitTextToSize(text, maxWidth);
      ensureSpace(lines.length * 5.2 + 4);
      doc.text(lines, margin, y);
      y += lines.length * 5.2 + 4;
    }
    function riskTag(text){
      ensureSpace(8);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(9);
      doc.setTextColor(orange[0], orange[1], orange[2]);
      doc.text('RIESGO: ' + text.toUpperCase(), margin, y);
      y += 8;
    }
    function checkItem(text){
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10.5);
      doc.setTextColor(40, 40, 60);
      var lines = doc.splitTextToSize(text, maxWidth - 8);
      ensureSpace(lines.length * 5.2 + 2);
      doc.setDrawColor(navy[0], navy[1], navy[2]);
      doc.rect(margin, y - 3.5, 3.2, 3.2);
      doc.text(lines, margin + 7, y);
      y += lines.length * 5.2 + 2;
    }
    function noteBox(text){
      if(!text) return;
      doc.setFont('helvetica', 'italic');
      doc.setFontSize(9.5);
      doc.setTextColor(120, 90, 20);
      var lines = doc.splitTextToSize(text, maxWidth);
      ensureSpace(lines.length * 5 + 6);
      doc.text(lines, margin, y);
      y += lines.length * 5 + 8;
    }
    function spacer(h){ y += h; }
    function divider(){
      ensureSpace(8);
      doc.setDrawColor(230, 236, 247);
      doc.line(margin, y, pageW - margin, y);
      y += 8;
    }

    // COVER
    doc.setFillColor(navy[0], navy[1], navy[2]);
    doc.rect(0, 0, pageW, pageH, 'F');
    try{
      doc.addImage('data:image/png;base64,' + ISOTIPO_B64, 'PNG', margin, 30, 18, 18);
    }catch(e){}
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(26);
    var titleLines = doc.splitTextToSize('Te llamaron "de Google". ¿Y ahora que?', pageW - margin * 2);
    doc.text(titleLines, margin, 110);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(13);
    var subLines = doc.splitTextToSize('Guia rapida para duenos de negocios de servicios en Estados Unidos', pageW - margin * 2);
    doc.text(subLines, margin, 110 + titleLines.length * 11 + 12);
    doc.setFontSize(10);
    doc.setTextColor(164, 203, 220);
    doc.text('Por Luma Consultoria de Negocios', margin, pageH - 25);

    // CONTENT PAGES
    doc.addPage();
    y = margin;

    heading('Primero, respira');
    paragraph('Si contestaste una de estas llamadas, o presionaste un numero, lo mas probable es que no haya pasado nada grave. Casi ningun caso termina en un problema real.');
    paragraph('Esta guia esta ordenada de menos a mas serio. Busca lo que hiciste y sigue solo esos pasos. No necesitas hacerlos todos.');

    heading('Como saber si tu ficha esta bien');
    checkItem('Entra a business.google.com desde tu computadora o telefono.');
    checkItem('Inicia sesion con el correo de tu negocio.');
    checkItem('Si ves tu negocio y no hay ningun aviso rojo o naranja arriba, tu ficha esta bien.');
    paragraph('Google siempre avisa ahi y por correo. Si en ese panel no hay nada, no hay nada.');

    divider();
    heading('Busca tu caso');
    paragraph('Encuentra lo que te paso a ti y sigue solo esos pasos. No necesitas hacerlos todos.');

    cases.forEach(function(c){
      ensureSpace(20);
      subheading('Caso ' + c.num + '. ' + c.title);
      riskTag(c.risk);
      paragraph(c.desc);
      c.items.forEach(function(item){ checkItem(item); });
      noteBox(c.note);
      spacer(4);
    });

    divider();
    heading('Como reconocerlas la proxima vez');
    subheading('Google nunca:');
    checkItem('Te llama por telefono para verificar tu ficha');
    checkItem('Te pide dinero por verificarla, activarla o mantenerla');
    checkItem('Te presiona para que actues "ahora mismo"');
    checkItem('Te pide tu contrasena, ni por telefono ni por correo');
    spacer(3);
    subheading('Google si:');
    checkItem('Te avisa dentro del panel de business.google.com');
    checkItem('Te escribe desde una direccion que termina en @google.com');
    spacer(4);
    subheading('Las frases que delatan la estafa:');
    paragraph('"Tu negocio no aparece en las 5 plataformas principales de busqueda". "Verificacion de Google Voice Search". "Tu ficha fue marcada en nuestro sistema". "Presiona 1 ahora o tu ficha sera suspendida". "Somos del departamento de servicio al cliente".');
    paragraph('Ninguna de esas cosas existe.');

    divider();
    heading('La regla de oro');
    doc.setFillColor(navy[0], navy[1], navy[2]);
    ensureSpace(30);
    doc.roundedRect(margin, y - 5, maxWidth, 26, 3, 3, 'F');
    doc.setTextColor(255, 130, 1);
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(13);
    doc.text('Cuelga y verifica tu.', margin + 6, y + 6);
    doc.setTextColor(255, 255, 255);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(9.5);
    var goldLines = doc.splitTextToSize('No importa que tan real suene, ni si saben el nombre de tu negocio y tu direccion. Cuelga, entra a business.google.com, y mira con tus propios ojos.', maxWidth - 12);
    doc.text(goldLines, margin + 6, y + 13);
    y += 32;
    paragraph('Si hay un problema de verdad, ahi va a estar. Si no hay nada, no habia nada.');

    divider();
    heading('Tienes dudas sobre tu ficha?');
    paragraph('Escribenos y la revisamos contigo, sin costo. Luma Consultoria de Negocios, WhatsApp +58 412 478 4922, lumaconsultoriadenegocios.com');

    doc.save('guia-llamada-falsa-google-luma.pdf');
  }

})();
